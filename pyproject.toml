[project]
name = "india-pincode-ifsc-mcp"
version = "0.1.0"
description = "MCP server for Indian PIN codes (India Post) and bank IFSC codes: validate, look up, search and cross-reference addresses and bank branches."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ankur Kapuriya" }]
requires-python = ">=3.12"
keywords = ["mcp", "india", "pincode", "ifsc", "open-data"]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
]

[project.scripts]
india-pincode-ifsc-mcp = "india_pincode_ifsc_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
